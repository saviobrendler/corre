<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F0603A'/%3E%3Cpath d='M14 26l9 8 9-14 9 14 9-8-4 22H18z' fill='%23FFFFFF'/%3E%3C/svg%3E">
<meta name="theme-color" content="#FBF8F4">
<meta name="color-scheme" content="light">
<style>

:root{
--bg:#FBF8F4; --bg-2:#F2EDE6; --card:#FFFFFF; --card-2:#F7F3EE; --card-3:#EDE7DF;
--ink:#1D1A17; --ink-2:#5E5750; --ink-3:#857D74;
--linha:#E9E2D9; --linha-2:#D9D0C5;
--azul:#0F766E; --azul-e:#0A5A54; --azul-bg:#E1F2EF;
--verde:#14946C; --verde-e:#0E7556; --verde-bg:#E2F4EC;
--acao:#F0603A; --acao-e:#C7472A; --acao-c:#FF8A63;
--vermelho:#E0484D; --vermelho-e:#BF3439; --vermelho-bg:#FCEBEA;
--amarelo:#E9A23B; --amarelo-bg:#FDF2DF;
--roxo:#7A52C7; --roxo-bg:#F1EBFB; --rosa:#E5487F; --ouro:#C98A0B; --ouro-bg:#FCF3DC;
--dock:#1F2A30; --dock-2:#2B3840;
--surface:var(--card); --surface-2:var(--card-3); --manga:var(--amarelo); --uva:var(--roxo); --laranja:#FF8A00;
--piscina:var(--azul); --paper:#FFFFFF; --stroke:var(--linha-2); --hair:var(--linha); --ouro-c:var(--ouro);
--sombra:0 1px 2px rgba(40,28,16,.06),0 1px 1px rgba(40,28,16,.03);
--sombra-2:0 12px 32px rgba(40,28,16,.16);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mola:cubic-bezier(.2,.9,.25,1);
color-scheme:light;
}
html{height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.screen.on{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}}
.screen>*{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex-shrink:0}
@media (min-width:520px){body{background:var(--bg-2)}#app{box-shadow:0 0 0 1px var(--linha),0 20px 60px rgba(16,24,40,.08)}}
.btn{display:block;width:100%;border:1px solid var(--linha-2);border-radius:14px;background:#fff;color:var(--ink);font-family:var(--font-r);font-size:16.5px;font-weight:700;padding:14px 18px;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primario{background:var(--acao);border-color:transparent;color:#fff;box-shadow:0 4px 0 var(--acao-e),0 8px 18px rgba(240,96,58,.25)}
.btn.primario:active{transform:translateY(2px);box-shadow:0 2px 0 var(--acao-e)}
.btn.sec{background:#fff}
@media (hover:hover){.btn.sec:hover{background:var(--card-2)}}
.btn.mini{padding:9px 14px;font-size:14px;width:auto;display:inline-block}
.btn:disabled{opacity:.45;pointer-events:none}
.mini-bt{border:1px solid var(--linha-2);border-radius:10px;background:#fff;color:var(--ink);font-weight:600;font-size:13px;padding:7px 11px}
.mini-bt:active{background:var(--card-3)}
.marca{margin:0;font-family:var(--font);font-weight:900;font-style:italic;font-size:clamp(62px,18vw,84px);line-height:.9;letter-spacing:-.045em;color:var(--ink);display:inline-flex;align-items:flex-start;gap:4px}
.marca .coroa{width:.26em;height:.26em;fill:var(--amarelo);transform:rotate(14deg)}
.rot-ouro{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--azul)}
.ret{display:block;border-radius:50%;overflow:hidden;background:#EDE6DC;flex-shrink:0;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--linha)}
.ret svg{display:block;width:100%;height:100%}
#scr-inicio{padding:calc(30px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));justify-content:space-between;gap:18px;overflow:auto;background:linear-gradient(180deg,#E7F4F1 0%,var(--bg) 46%)}
.ini-topo{padding-top:3vh}
.slogan{font-size:17px;font-weight:500;color:var(--ink-2);margin:14px 0 0;max-width:30ch;text-wrap:balance}
.fases{display:flex;gap:8px;align-items:flex-end}
.fases .ret{animation:sobefase .6s var(--mola) both}
.fases .ret:nth-child(2){animation-delay:.07s}.fases .ret:nth-child(3){animation-delay:.14s}.fases .ret:nth-child(4){animation-delay:.21s}.fases .ret:nth-child(5){animation-delay:.28s}
@keyframes sobefase{from{transform:translateY(14px);opacity:0}}
.fases-leg{margin:12px 0 0;font-size:13px;color:var(--ink-3)}
.inicio-acoes{display:grid;gap:10px}
.ini-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots{display:grid;gap:10px}
.slots .btn{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rodape{font-size:11.5px;color:var(--ink-3);text-align:center;margin:16px auto 0;line-height:1.45;max-width:330px}
#scr-nasc{padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;gap:16px;background:var(--bg-2)}
.nasc-topo{display:flex;align-items:center;gap:16px;padding:6px 2px}
.nasc-topo .ret{width:84px;height:84px}
.nasc-titulo{font-family:var(--font-r);font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
.nasc-sub{font-size:14px;color:var(--ink-2);margin:5px 0 0}
.bloco .g-tit{margin:0 4px 8px}
.bloco-c{background:#fff;border-radius:16px;padding:14px;display:grid;gap:14px;box-shadow:var(--sombra)}
.bloco-c>*{min-width:0}
.nome-linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nome-linha input{flex:1 1 60%;min-width:0;font:inherit;font-size:20px;font-weight:700;border:1px solid var(--linha-2);border-radius:12px;padding:10px 12px;background:var(--card-2);color:var(--ink)}
.nome-linha span{font-size:18px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.custom-l{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.custom-l>span{font-size:14px;font-weight:500;color:var(--ink-2)}
.seg{display:flex;border-radius:10px;overflow:hidden;background:var(--card-3);padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:13.5px;padding:7px 11px;border-radius:8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.1);padding:0}
.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--azul)}
select.cid{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--linha-2);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);max-width:62%}
.jeito{background:var(--card-2);border-radius:12px;padding:12px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.jeito b{font-size:16px;color:var(--ink);display:block;margin-bottom:3px}
.fam{list-style:none;padding:0;margin:0;display:grid;font-size:14.5px}
.fam li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--linha)}
.fam li:first-child{border-top:0;padding-top:0}
.fam li span{color:var(--ink-2)}
.fam b{font-weight:600;text-align:right}
.sorteio .btn.mini{justify-self:start}
.vtopo{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--linha);background:#fff}
.perfil-top{flex:1;display:flex;align-items:center;gap:11px;min-width:0;border:0;background:none;padding:0;text-align:left}
.perfil-top .ret{width:52px;height:52px;transition:transform .4s var(--mola)}
.perfil-top .ret.pulo{transform:scale(1.08)}
.quem{min-width:0;flex:1;display:flex;flex-direction:column}
.v-nome{font-family:var(--font-r);font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-nome.longo{font-size:16px}
.v-ocup{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grana{border:0;background:none;padding:2px 2px 2px 4px;text-align:right;flex-shrink:0}
.grana b{display:block;font-family:var(--font-r);font-size:18px;font-weight:800;color:var(--verde-e);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.grana small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.grana.neg b{color:var(--vermelho-e)}
.icone{width:38px;height:38px;border:0;border-radius:12px;background:var(--card-2);display:grid;place-items:center;padding:0;color:var(--ink-2);flex-shrink:0}
.icone svg{width:20px;height:20px}
.status{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
.status::-webkit-scrollbar{display:none}
.status:empty{display:none}
.st-chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--card-3);color:var(--ink-2);white-space:nowrap;flex-shrink:0}
.st-chip svg{width:13px;height:13px}
.st-chip.preso{background:var(--vermelho-bg);color:var(--vermelho-e)}
.st-chip.fama{background:var(--ouro-bg);color:#9A6B00}
.metas{padding:8px 14px 0}
.metas:empty{display:none}
.obj{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--azul-bg);border-radius:12px;padding:8px 10px 8px 9px;color:var(--ink)}
.obj .oi{width:30px;height:30px;border-radius:9px;background:var(--azul);display:grid;place-items:center;color:#fff;flex-shrink:0}
.obj .oi svg{width:16px;height:16px}
.obj .ot{flex:1;min-width:0}
.obj .ot span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--azul-e)}
.obj .ot span em{font-style:normal;color:var(--ink-3)}
.obj .ot b{display:block;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .op2{color:var(--azul);display:flex}
.obj.ok{background:var(--verde-bg)} .obj.ok .oi{background:var(--verde)} .obj.ok .ot span{color:var(--verde-e)} .obj.ok .op2{color:var(--verde-e)}
.vscroll{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 18px;overscroll-behavior:contain;position:relative}
.filtros{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 2px;padding:2px 16px 6px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex-shrink:0;border:0;background:var(--card-3);color:var(--ink-2);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600}
.filtros button.on{background:var(--ink);color:#fff}
.ano{padding:10px 0 8px}
.ano+.ano{border-top:1px solid var(--linha)}
.ano-h{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.ano-h b{font-family:var(--font-r);font-size:16px;font-weight:800;color:var(--ink)}
.ano-h span{font-size:12px;font-weight:500;color:var(--ink-3)}
.ano:first-child .ano-h b{color:var(--azul)}
.ano:first-child{animation:novoano .45s var(--mola)}
@keyframes novoano{from{transform:translateY(-8px);opacity:0}}
.ano p{margin:0;padding:3px 0;font-size:15px;line-height:1.45;color:var(--ink)}
.ano p .pi{display:none}
.op{font-weight:700;color:var(--ink)}
.op::after{content:': '}
.it-flavor,.it-info{color:var(--ink-2)!important}
.it-fase{font-weight:700}
.it-evento{font-weight:500}
.it-bom,.it-pos{color:var(--verde-e)!important;font-weight:600}
.it-ruim,.it-neg{color:var(--vermelho-e)!important;font-weight:600}
.it-raro{color:var(--azul-e)!important;font-weight:600}
.it-lendario{color:#B27E00!important;font-weight:700}
.it-meta{color:var(--verde-e)!important;font-weight:700}
.it-fig{color:var(--roxo)!important;font-weight:600}
.it-memoria{color:var(--roxo)!important}
.it-memoria::before{content:'↺ '}
.ano .mini{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 2px}
.ano .mini span{font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;background:var(--card-3);color:var(--ink-2)}
.ano .mini span.pos{background:var(--verde-bg);color:var(--verde-e)} .ano .mini span.neg{background:var(--vermelho-bg);color:var(--vermelho-e)}
.ano.vazio-ano{padding:8px 0 6px}
.ano.vazio-ano .ano-h{margin:0}
#feed p[data-fi]{cursor:pointer}
#feed p.fav{background:var(--ouro-bg);border-radius:8px;padding:3px 6px;margin:0 -6px}
#feed p.fav::before{content:'★ ';color:var(--ouro)}
.stats{display:grid;gap:7px;padding:10px 16px 11px;background:var(--card-2);border-top:1px solid var(--linha)}
.stat{display:grid;grid-template-columns:112px 1fr 42px;align-items:center;gap:10px;cursor:pointer;min-width:0}
.stat .sl{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink)}
.stat .sl svg{width:16px;height:16px}
#st-humor .sl svg{color:#E8A400} #st-saude .sl svg{color:var(--vermelho)} #st-cabeca .sl svg{color:var(--rosa)} #st-aparencia .sl svg{color:var(--roxo)}
.stat .val{font-family:var(--font-r);font-weight:800;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .val::after{content:'%'}
.barra{height:10px;border-radius:99px;background:#E4DDD3;overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:99px;background:var(--verde);transition:width .7s var(--mola),background .3s}
.stat.med .barra i{background:var(--amarelo)} .stat.baixo .barra i{background:var(--vermelho)}
.dock{display:grid;grid-template-columns:1fr 1fr 82px 1fr 1fr;align-items:end;padding:4px 4px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--dock);background:var(--dock);position:relative;z-index:2}
.dbtn{position:relative;background:none;border:0;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;padding:8px 0 2px;color:#C9D3D8}
.dbtn svg{width:25px;height:25px;color:#7FD1C4}
.dbtn.ativo{color:#fff}.dbtn.ativo svg{color:var(--acao-c)}
.dbtn:active{transform:scale(.94)}
.dbtn .pt{display:none;width:8px;height:8px;border-radius:50%;background:var(--vermelho);border:2px solid var(--dock);position:absolute;top:5px;right:calc(50% - 17px)}
.dbtn.alerta .pt{display:block}
.mais{justify-self:center;width:68px;height:68px;margin-top:-24px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 28%,var(--acao-c),var(--acao) 60%,#D9502D);box-shadow:0 0 0 5px var(--dock),0 4px 0 5px var(--dock),0 6px 0 var(--acao-e),0 10px 24px rgba(240,96,58,.35);display:grid;place-items:center;align-content:center;padding:0;color:#fff;position:relative;transition:transform .1s}
.mais b{font-family:var(--font-r);font-size:24px;font-weight:900;line-height:.9;letter-spacing:-.03em}
.mais span{font-family:var(--font-r);font-size:10px;font-weight:800;letter-spacing:.1em;margin-top:2px}
.mais:active{transform:translateY(3px)}
.mais::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(240,96,58,.5);opacity:0;animation:anel 2.4s ease-out infinite}
@keyframes anel{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.3);opacity:0}}
.mais:disabled{filter:grayscale(.8);opacity:.6}
.mais:disabled::after{display:none}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.nav{position:fixed;left:50%;top:0;bottom:0;width:min(100%,480px);transform:translate(-50%,104%);z-index:21;background:var(--bg-2);display:flex;flex-direction:column;transition:transform .38s var(--mola);overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav.on{transform:translate(-50%,0)}
.nav-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 12px;background:linear-gradient(180deg,#14877E,var(--azul));color:#fff;box-shadow:0 2px 10px rgba(15,118,110,.25)}
.nav-head .tt{min-width:0;text-align:center;grid-column:2}
.nav-head h2{margin:0;font-family:var(--font-r);font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-head p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn{border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;display:grid;place-items:center;padding:0;flex-shrink:0}
.nbtn:active{background:rgba(255,255,255,.28)}
#nav-voltar{grid-column:1;grid-row:1}
#nav-fechar{grid-column:3;grid-row:1}
.nbtn[hidden]{display:none!important}
.pages{position:relative;flex:1 1 0;min-height:0}
.page{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 34px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page.entra{animation:pentra .28s var(--mola)}
.page.volta{animation:pvolta .26s var(--mola)}
@keyframes pentra{from{transform:translateX(36px);opacity:0}}
@keyframes pvolta{from{transform:translateX(-28px);opacity:0}}
.grupo{margin:0 0 20px}
.g-tit{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 6px 7px}
.lista{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;position:relative;transition:background .12s;color:var(--ink);min-height:52px}
.row+.row::before{content:'';position:absolute;left:58px;right:0;top:0;height:1px;background:var(--linha)}
.row:active{background:var(--card-3)}
@media (hover:hover){.row:hover{background:var(--card-2)}}
.row:disabled{opacity:.45}
.ri{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:var(--c,var(--azul));color:#fff;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.ri svg{width:19px;height:19px;stroke-width:2.1}
.ri.face,.ri:has(.rt-ret){background:none;box-shadow:none;padding:0}
.ri .rt-ret{width:34px;height:34px;border-radius:50%;overflow:hidden;display:block;background:#EDE6DC}
.ri .rt-ret svg{width:100%;height:100%;display:block}
.ri.ilu{width:54px;height:40px;padding:0;background:var(--card-2);box-shadow:none;border-radius:10px}
.ri.ilu svg{width:52px;height:36px}
.row:has(.ri.ilu){grid-template-columns:54px 1fr auto}

.obit p{margin:5px 0;font-size:14px;line-height:1.5;color:var(--ink)}
.placar{display:block;font-family:var(--font-r);font-size:38px;font-weight:900;color:var(--azul);font-variant-numeric:tabular-nums}
.recorde{color:var(--verde-e);font-weight:700}
.fim-grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fbox{border-radius:12px;padding:10px 12px;background:var(--card-2);opacity:0;animation:revela .45s var(--mola) forwards}
.fbox b{display:block;font-family:var(--font-r);font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.fbox span{font-size:12px;color:var(--ink-2)}
.fbox.largo{grid-column:1/-1}
.fbox.largo b{font-family:var(--font);font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
@keyframes revela{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fim-figs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fim-acoes{display:grid;gap:10px;margin-top:16px}
.herdeiros{display:grid;gap:8px;margin-top:14px}
.herdeiros p{margin:0;font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
#scr-album{overflow-y:auto;background:var(--bg-2)}
.alb-topo{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.alb-topo .nbtn{background:#fff;color:var(--ink);box-shadow:var(--sombra)}
.alb-topo h2{margin:0;font-family:var(--font-r);font-size:26px;font-weight:900}
.alb-topo p{margin:0;font-size:13px;color:var(--ink-2)}
.alb-prog{margin:4px 16px 16px;height:8px;border-radius:99px;overflow:hidden;background:#E4DDD3}
.alb-prog i{display:block;height:100%;background:var(--roxo)}
.alb-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 10px;padding:4px 16px 30px;justify-items:center}
.alb-sec{grid-column:1/-1;justify-self:stretch;font-size:12px;font-weight:700;color:var(--ink-3);margin:14px 2px -2px;display:flex;justify-content:space-between;letter-spacing:.06em;text-transform:uppercase}
.fig{width:80px;border-radius:12px;background:#fff;padding:8px 5px 7px;text-align:center;position:relative;overflow:hidden;color:var(--ink);box-shadow:var(--sombra)}
.alb-grade .fig{width:100%;max-width:104px}
.fig .e{line-height:1.1;display:grid;place-items:center;height:46px}
.fig .e>svg:not([width]){width:26px;height:26px;color:var(--azul)}
.fig .n{font-size:11px;font-weight:600;line-height:1.2;display:block;margin-top:4px;color:var(--ink-2)}
.fig.r{box-shadow:0 0 0 2px rgba(15,118,110,.45)}
.fig.l{box-shadow:0 0 0 2px #E8B520;background:linear-gradient(160deg,#FFF6DC,#fff 65%)}
.fig.l .e>svg:not([width]){color:var(--ouro)}
.fig.l::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 48%,transparent 60%);background-size:260% 100%;animation:brilho 3s linear infinite}
@keyframes brilho{from{background-position:150% 0}to{background-position:-100% 0}}
.fig .novo{position:absolute;top:4px;right:4px;background:var(--vermelho);color:#fff;border-radius:5px;font-size:8.5px;font-weight:800;padding:1px 4px;z-index:1}
.fig.off{background:transparent;box-shadow:none;border:1.5px dashed var(--linha-2)}
.fig.off .e>svg{width:18px;height:18px;color:var(--ink-3)}
.fig.off .n{color:var(--ink-3)}
.fuga{position:fixed;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:#fff;color:var(--ink)}
.fuga.on{display:flex}
.fuga h3{margin:0;font-family:var(--font-r);font-size:24px;font-weight:900}
.fuga p{margin:0;font-size:14.5px;color:var(--ink-2);text-align:center;max-width:32ch}
.fgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:min(92vw,380px);aspect-ratio:1}
.fc{border-radius:8px;background:var(--card-3);display:grid;place-items:center;border:0;padding:0;transition:background .15s;color:var(--ink)}
.fc svg{width:55%;height:55%}
.fc.parede{background:#5B6270}
.fc.saida{background:var(--verde);color:#fff}
.fc.pode{background:#D6EEE9;box-shadow:inset 0 0 0 2px var(--azul)}
.fc.luz{background:#FDE8CC}
.fc.guarda{background:var(--vermelho-bg);color:var(--vermelho-e)}
.fc.voce i{display:block;width:48%;height:48%;border-radius:50%;background:var(--azul);box-shadow:0 0 0 4px rgba(15,118,110,.25)}
.fsetas{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.fsetas span{display:block}
.fsetas button{height:52px;border-radius:12px;border:0;background:var(--azul);color:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--azul-e)}
.mg-barra{position:relative;width:min(92vw,380px);height:34px;border-radius:17px;background:var(--card-3);overflow:hidden;border:1px solid var(--linha);cursor:pointer}
.mg-zona{position:absolute;top:0;bottom:0;background:var(--verde);opacity:.55}
.mg-pino{position:absolute;top:3px;bottom:3px;width:8px;margin-left:-4px;border-radius:4px;background:var(--ink);box-shadow:0 0 0 2px #fff;transition:background .2s}
.mg-pino.ok{background:var(--verde);box-shadow:0 0 0 4px rgba(20,148,108,.35)}
.mg-pino.no{background:var(--vermelho);box-shadow:0 0 0 4px rgba(238,66,55,.35)}
.mg-btn{width:min(92vw,380px);margin-top:6px}
.mg-kv{display:flex;gap:18px;justify-content:center}
.mg-kv div{text-align:center}
.mg-kv b{display:block;font-family:var(--font-r);font-size:20px;font-weight:900}
.mg-kv span{font-size:12px;color:var(--ink-2)}
.mg-kv .vr{color:var(--vermelho)} .mg-kv .vm{color:var(--amarelo)} .mg-kv .vd{color:var(--verde)}
.mg-prat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,380px)}
.mg-item{border:1px solid var(--linha);border-radius:12px;background:var(--card);padding:12px 8px;text-align:center;color:var(--ink);min-height:64px}
.mg-item b{display:block;font-size:14px;font-weight:800}
.mg-item small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px}
.mg-item.off{opacity:.45;background:var(--card-3)}
.mg-item:active{transform:scale(.97)}
.mg-fios{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,380px)}
.mg-fio{height:96px;border-radius:14px;border:0;background:var(--c);opacity:.45;transition:opacity .12s,transform .12s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.mg-fio.acende{opacity:1;transform:scale(1.05);box-shadow:0 0 0 4px rgba(0,0,0,.08),inset 0 -6px 0 rgba(0,0,0,.15)}
.mg-st{font-weight:700;color:var(--ink)!important}
.mg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(92vw,360px);aspect-ratio:1}
.mg-grid.m6{grid-template-columns:repeat(6,1fr)}
.mg-c{border-radius:9px;border:0;background:var(--card-3);display:grid;place-items:center;color:var(--ink);padding:0;font-weight:800;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.mg-c svg{width:52%;height:52%}
.mg-c.ab{background:#fff;border:1px solid var(--linha);box-shadow:none;color:var(--ink-3)}
.mg-c.loot{color:var(--ouro);background:var(--ouro-bg)}
.mg-c.alarme{color:var(--vermelho);background:var(--vermelho-bg)}
.mg-c.cao{color:#8A5A2E;background:#F3E3C8}
.mg-c.dono{color:var(--vermelho);background:var(--vermelho-bg)}
.mg-c.pode{background:#D6EEE9;box-shadow:inset 0 0 0 2px var(--azul)}
.mg-c.voce{background:var(--azul);color:#fff}
.mg-c.alvo{background:var(--verde);color:#fff}
.mg-c.num{color:var(--ink);background:#fff}
.mg-c:disabled{opacity:.9}
.folha.app{text-align:center}
.app-foto{width:120px;height:120px;margin:10px auto 6px;border-radius:50%;overflow:hidden;background:var(--card-3)}
.app-foto svg{width:100%;height:100%}
.app-nome{margin:0;font-family:var(--font-r);font-size:22px;font-weight:900}
.app-bio{margin:4px 0 12px;color:var(--ink-2);font-size:14px}
.app-st{text-align:left;display:grid;gap:8px;margin-bottom:14px}
.app-st span{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:3px}
.app-st span b{color:var(--ink)}
.app-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:46;overflow:hidden}
.conf{position:absolute;top:-16px;width:8px;height:13px;border-radius:2px;animation:cai var(--d) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes cai{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.flut{position:fixed;z-index:41;font-family:var(--font-r);font-weight:800;font-size:15px;pointer-events:none;animation:sobe 1.1s ease-out forwards;font-variant-numeric:tabular-nums}
.flut.pos{color:var(--verde-e)} .flut.neg{color:var(--vermelho-e)}
@keyframes sobe{from{transform:translateY(0);opacity:0}20%{opacity:1;transform:translateY(-6px)}to{transform:translateY(-34px);opacity:0}}
.tremor{animation:treme .35s}
body.treme #app{animation:treme .4s}
@keyframes treme{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:#fff;color:var(--ink);border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px;box-shadow:0 12px 32px rgba(16,24,40,.18),0 0 0 1px var(--linha);animation:tin .35s var(--mola);display:flex;gap:10px;align-items:center}
.toast::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--azul);flex-shrink:0}
.toast.t-meta::before{background:var(--verde)} .toast.t-fig::before{background:var(--roxo)}
@keyframes tin{from{transform:translateY(-18px);opacity:0}}
.coach{position:fixed;inset:0;z-index:60}
.coach .furo{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(17,24,39,.62);border:2px solid #fff;transition:all .35s var(--mola);pointer-events:none}
.coach .bal{position:fixed;left:16px;right:16px;max-width:440px;margin:0 auto;background:#fff;color:var(--ink);border-radius:14px;padding:13px 15px;font-weight:500;font-size:15px;line-height:1.45;box-shadow:var(--sombra-2);animation:sobefase .35s var(--mola)}
.coach .bal small{display:block;margin-top:6px;font-size:12px;color:var(--ink-3)}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .45s ease}
.splash .marca{animation:sobefase .7s var(--mola) both}
.splash p{color:var(--ink-3);font-size:14px;margin:18px 24px 0;text-align:center;animation:fadein .8s .3s both;max-width:30ch}
.splash.sai{opacity:0;pointer-events:none}
html.fonte-g #app,html.fonte-g .nav,html.fonte-g .modal,html.fonte-g .momento{zoom:1.12}
html.contraste{--ink-2:#2E333D;--ink-3:#4A505C;--linha:#C9CED6}
html.rapido *,html.rapido *::before,html.rapido *::after{animation-duration:.12s!important;transition-duration:.1s!important}
html.dalton{--verde:#2F7BEF;--verde-e:#1E63D0;--vermelho:#F08A00;--vermelho-e:#C46F00}
html.dislexia body{letter-spacing:.03em;word-spacing:.1em;line-height:1.6}
html.compacto .ano .it-flavor,html.compacto .ano .mini{display:none}
html.compacto .ano.vazio-ano{display:none}
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.conf{display:none}
}
.dica{display:flex;align-items:flex-start;gap:10px;background:var(--azul-bg);color:var(--azul-e);border-radius:12px;padding:10px 8px 10px 12px;margin:0 0 14px;font-size:13.5px;font-weight:500;line-height:1.4;animation:sobefase .35s var(--mola)}
.dica>svg{width:18px;height:18px;margin-top:1px}
.dica span{flex:1}
.dica button{border:0;background:none;color:var(--azul-e);padding:2px;display:grid;place-items:center;opacity:.7}
.dica button svg{width:16px;height:16px}
.nome-linha input{flex:1 1 40%}
.sel-l{display:flex;align-items:center;gap:8px}
.sel-l b{min-width:120px;text-align:center;font-size:14px;font-weight:600}
.sel-l .mini-bt{width:34px;padding:7px 0;font-size:18px;line-height:1}
.sel-l .mini-bt svg{width:17px;height:17px;vertical-align:-3px}
.sel-l select.cid{max-width:none;flex:1;min-width:0}
.ri .sigla{font-family:var(--font-r);font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#fff}
.fases .ret{flex:0 1 64px;aspect-ratio:1;min-width:0;height:auto!important;width:auto!important}

</style>
</head>

<div id="app">
  <section id="scr-inicio" class="screen on">

      <div><h2>Álbum</h2><p id="alb-cont"></p></div>
